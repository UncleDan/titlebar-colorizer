<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <clipPath id="win"><rect x="6" y="14" width="108" height="92" rx="14"/></clipPath>
  </defs>
  <!-- finestra -->
  <rect x="6" y="14" width="108" height="92" rx="14" fill="#ffffff"/>
  <g clip-path="url(#win)">
    <rect x="6" y="14" width="108" height="32" fill="url(#bar)"/>
    <rect x="18" y="58" width="58" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="18" y="74" width="42" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="18" y="90" width="50" height="8" rx="4" fill="#e2e8f0"/>
  </g>
  <rect x="6" y="14" width="108" height="92" rx="14" fill="none" stroke="#334155" stroke-width="5"/>
  <!-- pulsanti finestra -->
  <circle cx="74" cy="30" r="5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="88" cy="30" r="5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="102" cy="30" r="5" fill="#ffffff" fill-opacity="0.9"/>
  <!-- goccia di colore -->
  <path d="M100 58 C100 58 78 84 78 98 A22 22 0 0 0 122 98 C122 84 100 58 100 58 Z"
        fill="url(#drop)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="92" cy="98" rx="4" ry="7" fill="#ffffff" fill-opacity="0.55" transform="rotate(-20 92 98)"/>
</svg>
